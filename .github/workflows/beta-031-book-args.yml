name: Beta 0.3.1 Book argument validation

on:
  push:
    branches: [beta-0.3.1]
  pull_request:
    branches: [beta-0.3.1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-and-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise the standalone Book argument parser
        run: |
          set -eu
          cc -std=c11 -Wall -Wextra -Wpedantic -Werror \
            -Isrc/books tests/book_args_test.c src/books/book_args.c \
            -o /tmp/kami-book-args-test
          /tmp/kami-book-args-test
      - name: Validate controlled loopback fixture and evidence verifier
        run: python3 -m unittest discover -s tests -p 'test_beta031_book_lab.py' -v
      - name: Verify release version and native dependency pins
        run: sh scripts/check-release-versions.sh
      - name: Prepare native syntax-check dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev
      - name: Syntax-check the complete Kaminowaku C source tree
        run: |
          set -eu
          mkdir -p .STAGE/include
          find src -type f -name '*.h' -exec cp '{}' .STAGE/include/ \;
          find src -type f -name '*.c' | LC_ALL=C sort | while IFS= read -r source; do
            cc -std=gnu11 -D_DEFAULT_SOURCE -Wall -Wextra -Wpedantic -pthread \
              -iquote .STAGE/include -Ilibs/nosix/include \
              -fsyntax-only "$source"
          done

  runtime-integration:
    name: Native Lua invocation smoke
    runs-on: ubuntu-24.04
    needs: parser-and-source
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Compile native scanner and dependencies
        run: |
          make OPENSSL_MODE=offline \
            CFLAGS='-std=c11 -D_DEFAULT_SOURCE -O2 -Wall -Wextra -pthread' \
            LDFLAGS='-pthread'
      - name: Compile and execute Book Lua runtime contract
        run: |
          set -eu
          mkdir -p .STAGE/include
          find src -type f -name '*.h' -exec cp '{}' .STAGE/include/ \;
          cc -std=gnu11 -D_DEFAULT_SOURCE -O2 -Wall -Wextra -pthread \
            -iquote .STAGE/include -Ilibs/nosix/include \
            tests/book_args_runtime_test.c \
            $(find .STAGE/obj -type f -name '*.o' ! -name main.o | LC_ALL=C sort) \
            -L.STAGE/lib/kaminowaku \
            -Wl,-rpath,"$PWD/.STAGE/lib/kaminowaku" \
            -lnosix libs/openssl/linux/lib/libssl.a \
            libs/openssl/linux/lib/libcrypto.a -ldl \
            -o /tmp/kami-book-runtime-test
          /tmp/kami-book-runtime-test
