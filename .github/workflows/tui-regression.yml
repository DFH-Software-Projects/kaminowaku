name: TUI regressions

on:
  push:
    branches: [main, beta-v2]
    paths:
      - 'src/ui/**'
      - 'src/tools/tool_pty.c'
      - 'src/kaminowaku.c'
      - 'src/command/**'
      - 'tests/**'
      - '.github/workflows/tui-regression.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
      - name: Compile and run retained regressions
        run: sh tests/run-tui-regressions.sh --bench
      - name: Full application build
        run: make OPENSSL_MODE=online
      - name: Validate staged binary
        run: test -x .STAGE/bin/kaminowaku
