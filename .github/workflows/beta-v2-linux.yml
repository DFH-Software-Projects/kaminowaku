name: Beta V2 Linux smoke
on:
  push:
    branches: [beta-v2]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/beta-v2-linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev
      - name: All TUI regressions and compositor benchmark
        run: sh tests/run-tui-regressions.sh --bench
      - name: Linux application build
        run: make OPENSSL_MODE=online
      - name: Verify staged executable
        run: test -x .STAGE/bin/kaminowaku && file .STAGE/bin/kaminowaku
