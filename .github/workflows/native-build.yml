name: Kaminowaku native build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify 0.3.0 version references and release scripts
        run: |
          grep -Fx '#define VERSION "0.3.0"' src/data.h
          grep -Fq '**Kaminowaku 0.3.0**' README.md
          grep -Fq '## 0.3.0 — Unreleased' CHANGELOG.md
          grep -Fq '0.3.0 (`main`, current source)' SECURITY.md
          grep -Fq 'Kaminowaku 0.3.0.' docs/BOOK_LANGUAGE_V1.md
          sh -n release/package-native.sh
          sh -n uninstall.sh
      - name: Build from source against packaged dependencies
        run: make OPENSSL_MODE=offline CFLAGS='-std=c11 -D_DEFAULT_SOURCE -O2 -Wall -Wextra -pthread' LDFLAGS='-pthread'
      - name: Verify staged executable
        run: test -x .STAGE/bin/kaminowaku

  freebsd:
    name: FreeBSD 14.5 / amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build using packaged FreeBSD NOSIX and OpenSSL
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.5"
          arch: x86_64
          run: |
            set -eu
            make OPENSSL_MODE=offline CFLAGS='-std=c11 -D_DEFAULT_SOURCE -O2 -Wall -Wextra -pthread' LDFLAGS='-pthread'
            test -x .STAGE/bin/kaminowaku
