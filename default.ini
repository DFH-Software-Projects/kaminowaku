;===============================================================================
; PROFILE METADATA
;================================================================================
[profile]
name = default
version = 1
scope = global

;===============================================================================
; TRANSMIT POLICY
;===============================================================================
; This section controls where Kami sends packets and how outbound packet fields
; are generated.
;
; interface
;     Transmit interface.
;
;     auto
;         Kami chooses the outbound interface from the local route/system context.
;
;     explicit interface name
;         Kami transmits through the named interface.
;
;         Examples:
;             eth0, ens192, wlan0, wg0, tun0
;
; source_ip
;     Optional local IPv4 or IPv6 source address used for outbound packets.
;     Leave empty unless Kami must use a specific source address.
;
; gateway
;     Optional IPv4 or IPv6 next-hop gateway used for outbound traffic.
;     Leave empty to use the next hop selected by the local routing table.
;     An explicit value directs the L2 path to resolve and use that next hop.
;     When source_ip and gateway are both set, they must use the same family.
;
; strict
;     true
;         Fail closed if Kami cannot satisfy the requested transmit policy.
;
;     false
;         Treat the transmit policy as advisory.
;
; ttl
;     IPv4 Time To Live value used for transmitted IPv4 packets.
;
; hop_limit
;     IPv6 Hop Limit value used for transmitted IPv6 packets.
;
; ip_id_mode
;     Selects how Kami generates IPv4 Identification values.
;
;     random
;         Generate randomized IPv4 ID values.
;
;     static
;         Use a fixed IPv4 ID value.
;
;     increment
;         Increment the IPv4 ID value across packets.
;
; tcp_src_port_mode
;     Selects how Kami generates TCP source ports.
;
;     random
;         Generate randomized TCP source ports.
;
;     static
;         Use a fixed TCP source port.
;
;     increment
;         Increment TCP source ports across packets.
;
; checksum_mode
;     Selects how Kami handles packet checksums.
;
;     auto
;         Kami chooses the safest checksum behavior for the packet path.
;
;     manual
;         Kami calculates checksums directly.
;
; Valid interface values:
;     auto, or an explicit interface name
;
; Valid generation modes:
;     random, static, increment
;
; Valid checksum modes:
;     auto, manual
;
; Recommended default:
;     interface = auto
;     source_ip =
;     gateway =
;     strict = true
;     ttl = 255
;     hop_limit = 255
;     ip_id_mode = random
;     tcp_src_port_mode = random
;     checksum_mode = auto
;===============================================================================
[tx]
interface = auto
source_ip =
gateway =
strict = true
ttl = 255
hop_limit = 255
ip_id_mode = random
tcp_src_port_mode = random
checksum_mode = auto

;===============================================================================
; RECEIVE / PACKET CAPTURE POLICY
;===============================================================================
; This section controls how Kami listens for reply traffic and matches received
; packets to transmitted probes.
;
; interface
;     Interface used for packet capture.
;
;     same
;         Capture on the same interface selected by the transmit policy.
;
;     explicit interface name
;         Capture on a named interface.
;
;         Examples:
;             eth0, ens192, wlan0, wg0, tun0
;
; timeout_ms
;     Maximum time Kami waits for matching reply traffic before the transaction
;     is considered unanswered.
;
; promiscuous
;     true
;         Enable promiscuous capture mode when supported.
;         This allows the interface to receive frames not addressed directly to
;         the local host.
;
;     false
;         Capture only traffic normally visible to the interface.
;
;     Recommended default: false.
;
; snaplength
;     Maximum number of bytes captured per packet.
;
;     65535 captures full packets for most practical scanner workflows and
;     avoids truncating protocol data that may be useful for review.
;
; state
;     Selects the receive tracking model.
;
;     transaction
;         Kami treats each probe as a bounded transaction.
;         A packet is expected to match a specific transmit event within the
;         configured timeout window.
;
;         This is the recommended mode for one-command / one-frame scanning.
;
;     stream
;         Kami treats received packets as part of a longer running stream.
;         Reserved for future workflows where continuous capture or multi-packet
;         protocol tracking is needed.
;
; dedupe
;     true
;         Kami suppresses duplicate receive events for the same transaction.
;         This keeps output cleaner when the same reply is observed more than
;         once or captured through overlapping paths.
;
;     false
;         Kami records all matching receive events, including duplicates.
;
; match_policy
;     Selects how strictly Kami matches received packets to transmitted probes.
;
;     strict
;         Replies must closely match the expected transaction fields.
;         This is preferred for clean accounting and avoiding false associations.
;
;     loose
;         Replies may be accepted with relaxed matching.
;         This is useful for unusual networks, NAT behavior, asymmetric paths, or
;         protocol behavior that does not cleanly echo expected fields.
;
; Valid states:
;     transaction, stream
;
; Valid match policies:
;     strict, loose
;
; Recommended default:
;     interface = same
;     timeout_ms = 3000
;     promiscuous = false
;     snaplength = 65535
;     state = transaction
;     dedupe = true
;     match_policy = strict
;===============================================================================
[rx]
interface = same
timeout_ms = 3000
promiscuous = false
snaplength = 65535
state = transaction
dedupe = true
match_policy = strict

;===============================================================================
; DNS RESOLUTION POLICY
;===============================================================================
; This section controls how Kami resolves hostnames into IP addresses.
;
; All DNS network traffic is generated and captured through KWIRE -> NOSIX.
; Kaminowaku does not use the operating system resolver and does not fall back
; to libc, NSS, /etc/resolv.conf, or any alternate network path.
;
; server1
;     Required primary DNS server.
;     This should be an IPv4 address.
;
; server2
;     Optional secondary DNS server.
;     Leave empty if you only want one resolver.
;
; search_domain
;     Optional DNS search suffix used for bare hostnames.
;     Leave empty unless you intentionally want suffix expansion.
;
;     Example:
;         search_domain = example.com
;
; timeout_ms
;     Per-query timeout in milliseconds.
;     This controls how long Kami waits for a DNS response before considering
;     that query attempt failed.
;
; retries
;     Number of retry attempts before resolution is considered failed.
;
; Resolution is fail-closed. If the configured DNS servers cannot be reached or
; do not produce a usable response, Kami reports resolution failure rather than
; escaping the NOSIX network stack.
;
; Recommended default:
;     server1 = 8.8.8.8
;     server2 = 1.1.1.1
;     search_domain =
;     timeout_ms = 1500
;     retries = 2
;===============================================================================
[dns]
server1 = 8.8.8.8
server2 = 1.1.1.1
search_domain =
timeout_ms = 1500
retries = 2

;===============================================================================
; RESOURCE LIMITS
;===============================================================================
; This section controls Kami's runtime resource limits. These values are safety
; rails for transaction concurrency, capture volume, packet rate, DNS pressure,
; active target windows, and scan worker concurrency.
;
; max_pending_transactions
;     Maximum number of outstanding packet transactions Kami may track at once.
;
;     A transaction is a transmit event plus its expected receive/matching state.
;     Higher values allow more concurrency, but consume more memory and increase
;     bookkeeping pressure.
;
; max_capture_bytes_per_tx
;     Maximum number of captured bytes Kami may retain for a single transaction.
;
;     This prevents one noisy target, malformed response, or unexpected packet
;     burst from consuming excessive memory or disk space.
;
; max_capture_bytes_total
;     Maximum total captured bytes Kami may retain across active work.
;
;     This is the global capture ceiling. Once reached, Kami should stop retaining
;     additional capture data or fail closed depending on the calling workflow.
;
;     268435456 bytes = 256 MiB.
;
; max_tx_rate_pps
;     Maximum transmit rate in packets per second.
;
;     This limits how quickly Kami may place outbound packets on the wire.
;     The purpose is to avoid accidental flooding and keep scan behavior
;     controlled.
;
; max_rx_rate_pps
;     Maximum receive processing rate in packets per second.
;
;     This limits how much inbound packet traffic Kami will attempt to process.
;     Higher values allow heavier receive bursts, but increase CPU and memory
;     pressure.
;
; max_dns_queries_pending
;     Maximum number of unresolved DNS queries Kami may have in flight at once.
;
;     This prevents hostname-heavy workflows from overwhelming the configured DNS
;     resolvers or creating excessive local resolver state.
;
; max_targets_per_batch
;     Maximum number of target contexts Kami may materialize in one active scan
;     window. Larger projects are consumed by repeatedly refilling that window.
;
; max_scan_workers
;     Maximum number of reusable KWorker threads available to the scan scheduler.
;     Workers prepare and retire scan work; they do not own NOSIX network I/O.
;
; Recommended default:
;     max_pending_transactions = 4096
;     max_capture_bytes_per_tx = 65535
;     max_capture_bytes_total = 268435456
;     max_tx_rate_pps = 1000
;     max_rx_rate_pps = 5000
;     max_dns_queries_pending = 256
;     max_targets_per_batch = 1024
;     max_scan_workers = 8
;===============================================================================
[limits]
max_pending_transactions = 4096
max_capture_bytes_per_tx = 65535
max_capture_bytes_total = 268435456
max_tx_rate_pps = 1000
max_rx_rate_pps = 5000
max_dns_queries_pending = 256
max_targets_per_batch = 1024
max_scan_workers = 8
